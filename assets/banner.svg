<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:14px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.6);">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    /* Animated Dynamic Background Elements */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(30px, -20px); opacity: 0.65; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-40px) translateX(25px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes badgeShimmer {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px rgba(99, 102, 241, 0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.8)); }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 250px; }
    .p-1 { animation: floatParticle 6s ease-in-out infinite; }
    .p-2 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
    .p-3 { animation: floatParticle 7s ease-in-out infinite 3s; }
    .p-4 { animation: floatParticle 9s ease-in-out infinite 2s; }
    .floating-card-1 { animation: floatCard 5s ease-in-out infinite; }
    .floating-card-2 { animation: floatCard 6s ease-in-out infinite 1s; }
    .flow-path { stroke-dasharray: 20, 10; animation: flowLine 25s linear infinite; }
    .shimmer-badge { animation: badgeShimmer 4s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="90" r="140" fill="#4f46e5" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="240" r="160" fill="#a855f7" filter="url(#glow)" />
  <circle cx="650" cy="300" r="100" fill="#ec4899" opacity="0.18" filter="url(#glow)" />

  <!-- Flowing Dynamic Data Lines -->
  <path class="flow-path" d="M -50,280 Q 300,180 600,290 T 1250,200" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="2" />
  <path class="flow-path" d="M -50,120 Q 400,260 800,100 T 1250,260" fill="none" stroke="rgba(236, 72, 153, 0.2)" stroke-width="1.5" />

  <!-- Floating Ambient Particles -->
  <circle class="p-1" cx="180" cy="240" r="3" fill="#818cf8" />
  <circle class="p-2" cx="340" cy="80" r="2.5" fill="#f472b6" />
  <circle class="p-3" cx="890" cy="90" r="3" fill="#38bdf8" />
  <circle class="p-4" cx="1060" cy="140" r="3.5" fill="#c084fc" />

  <!-- Background Floating Decorative Stat Badges (Right Flank, Soft Layer) -->
  <g class="floating-card-1" opacity="0.65">
    <rect x="940" y="45" width="200" height="58" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <circle cx="965" cy="74" r="14" fill="rgba(99, 102, 241, 0.2)" />
    <text x="965" y="79" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">⚖️</text>
    <text x="990" y="67" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Enterprise ELM</text>
    <text x="990" y="86" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">Ironclad &amp; LawVu</text>
  </g>

  <g class="floating-card-2" opacity="0.65">
    <rect x="910" y="125" width="230" height="58" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <circle cx="935" cy="154" r="14" fill="rgba(52, 211, 153, 0.2)" />
    <text x="935" y="159" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="960" y="147" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Open-Source LPMS</text>
    <text x="960" y="166" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">10k+ Stars Ecosystem</text>
  </g>

  <!-- FOREGROUND: Main Content (Crisp, High Contrast, Guaranteed Foreground Visibility) -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <g class="shimmer-badge" transform="translate(0, 52)">
      <rect width="260" height="30" rx="15" fill="rgba(99, 102, 241, 0.18)" stroke="rgba(129, 140, 248, 0.45)" stroke-width="1" />
      <text x="130" y="20" fill="#c7d2fe" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">
        ⭐ CURATED LEGALTECH &amp; LPMS
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Legal Operations &amp;
    </text>
    <text x="0" y="194" fill="url(#accentGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Practice Management
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="238" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
      The definitive directory of premier SaaS platforms &amp; verified open-source LegalTech software.
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 274)">
      <!-- Pill 1 -->
      <g>
        <rect width="135" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="67" y="20" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">💼 Practice Mgmt</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(147, 0)">
        <rect width="135" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="67" y="20" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">📑 Contract CLM</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(294, 0)">
        <rect width="145" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="72" y="20" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">🤖 AI Legal Workflow</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(451, 0)">
        <rect width="145" height="32" rx="8" fill="rgba(52, 211, 153, 0.12)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" />
        <text x="72" y="20" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔓 100% Open Source</text>
      </g>
    </g>
  </g>
</svg>
