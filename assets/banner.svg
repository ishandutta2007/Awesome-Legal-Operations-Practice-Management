<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0b0f19;border-radius:14px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.6)"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e1a"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="goldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient><linearGradient id="emeraldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/><stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.18) translate(30px,-20px);opacity:.65}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-40px) translateX(25px);opacity:.8}}@keyframes floatCard{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes flowLine{0%{stroke-dashoffset:400}}@keyframes badgeShimmer{0%{opacity:.85;filter:drop-shadow(0 0 4px rgba(99,102,241,.4))}50%{opacity:1;filter:drop-shadow(0 0 12px rgba(168,85,247,.8))}}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb 10s ease-in-out infinite reverse;transform-origin:1000px 250px}.p-1{animation:floatParticle 6s ease-in-out infinite}.p-2{animation:floatParticle 8s ease-in-out infinite 1.5s}.p-3{animation:floatParticle 7s ease-in-out infinite 3s}.p-4{animation:floatParticle 9s ease-in-out infinite 2s}.floating-card-1{animation:floatCard 5s ease-in-out infinite}.floating-card-2{animation:floatCard 6s ease-in-out infinite 1s}.flow-path{stroke-dasharray:20,10;animation:flowLine 25s linear infinite}.shimmer-badge{animation:badgeShimmer 4s ease-in-out infinite}</style><rect width="100%" height="100%" fill="url(#bgGrad)"/><rect width="100%" height="100%" fill="url(#grid)"/><circle cx="220" cy="90" r="140" fill="#4f46e5" class="orb-1" filter="url(#glow)"/><circle cx="1020" cy="240" r="160" fill="#a855f7" class="orb-2" filter="url(#glow)"/><circle cx="650" cy="300" r="100" fill="#ec4899" filter="url(#glow)" opacity=".18"/><path fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="2" d="M -50,280 Q 300,180 600,290 T 1250,200" class="flow-path"/><path fill="none" stroke="rgba(236, 72, 153, 0.2)" stroke-width="1.5" d="M -50,120 Q 400,260 800,100 T 1250,260" class="flow-path"/><circle cx="180" cy="240" r="3" fill="#818cf8" class="p-1"/><circle cx="340" cy="80" r="2.5" fill="#f472b6" class="p-2"/><circle cx="890" cy="90" r="3" fill="#38bdf8" class="p-3"/><circle cx="1060" cy="140" r="3.5" fill="#c084fc" class="p-4"/><g class="floating-card-1" opacity=".65"><rect width="200" height="58" x="940" y="45" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="10"/><circle cx="965" cy="74" r="14" fill="rgba(99, 102, 241, 0.2)"/><text x="965" y="